[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marc-repair"
version = "0.1.0"
description = "Repair broken MARC21 (ISO 2709) records and patch missing/required fields."
requires-python = ">=3.12"
dependencies = [
    "pymarc>=5,<6",
]

# No [project.scripts] entry point on purpose: setuptools would copy
# marc_repair.py into site-packages, away from required_a_tags.txt /
# non_repeatable_tags.txt / holdings_required_a_tags.txt, which it
# locates by path relative to itself -- breaking those defaults.
# install.sh instead writes a venv/bin/marc_repair wrapper that runs
# the script in place, alongside its data files.
[tool.setuptools]
py-modules = []
